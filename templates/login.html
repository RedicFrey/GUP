{% extends "base.html" %}
{% block titulo %}Entrar - GUP{% endblock %}

{% block corpo %}
<div class="login-tela">
  <div class="login-titulo">GUP</div>
  <div class="login-subtitulo">Transforme tarefas em conquistas</div>

  {% with mensagens = get_flashed_messages() %}
    {% if mensagens %}
      {% for m in mensagens %}
        <div class="flash">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('login') }}">
    <div class="login-campo">
      <label for="tipo">Entrar como</label>
      <select name="tipo" id="tipo">
        <option value="responsavel">Responsável</option>
        <option value="crianca">Filho(a)</option>
      </select>
    </div>

    <div class="login-campo" style="margin-top:14px;">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="login-campo" style="margin-top:14px;">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required>
    </div>

    <button class="btn-entrar" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
