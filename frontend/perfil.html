<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/api.js" defer></script>
    <script src="js/perfil.js" defer></script>
    <title>Document</title>
</head>
<body>
    <h1>Perfil</h1>

    <form id="atualizar-usuario-perfil">

        <label class="label-perfil">Nome de Usuário:</label>
        <input type="text" id="nome-usuario-perfil" readonly>

        <label class="label-perfil">Email:</label>
        <input type="email" id="email-usuario-perfil" readonly>

        <label class="label-perfil">Senha</label>
        <input type="password" id="pwd-usuario-perfil" readonly>

        <label class="label-perfil strike nao-visivel" id="label-strike">Strike:</label>
        <input type="text" id="strike-usuario-perfil" class="nao-visivel" readonly>

        <button type="button" id="btn-mudar-perfil">Mudar perfil</button>
        <button type="submit" id="btn-atualizar-perfil" class="nao-visivel">Atualizar</button>

    </form>

    <p id="mensagem" class="mensagem"></p>

    <a href="dashboard.html">Voltar</a>

</body>
</html>
