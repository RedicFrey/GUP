<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - GUP</title>
    <script src="js/api.js" defer></script>
    <script src="js/cadastro.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <p class="tag">GUP</p>
            <h1>Criar conta</h1>
        </header>

        <section class="card">
            <form id="form-cadastro">
                <label for="nome">Seu nome</label>
                <input type="text" id="nome" placeholder="Daniel" required>

                <label for="email">Seu email</label>
                <input type="email" id="email" placeholder="user@gmail.com" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Sua senha" required>

                <label for="senha_confirmacao">Confirmação de senha</label>
                <input type="password" id="confirmacao_senha" placeholder="Digite novamente" required>

                <label for="data_nasc">Data de nascimento</label>
                <input type="date" id="data_nasc" required>

                <button type="submit">Cadastrar</button>
            </form>

            <p id="mensagem" class="mensagem"></p>
        </section>

        <a href="login.html">Já tem conta? Então faça login</a>
    </main>

</body>
</html>
