<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta família - GUP</title>
    <script src="js/api.js" defer></script>
    <script src="js/criar_conta_familia.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <h1>Criar conta família</h1>
        </header>

        <section class="card">
            <form id="form-familia">
                <label for="nome">Nome da conta</label>
                <input type="text" id="nome" required>

                <label for="pin">Pin da conta</label>
                <input type="password" id="pin" required>

                <label for="cargo">Cargo Conta</label>
                <input type="text" id="cargo" required>

                <button type="submit">Criar conta</button>
            </form>

            <p id="mensagem" class="mensagem"></p>
        </section>

        <a href="lobby.html">Voltar</a>
    </main>

</body>
</html>
