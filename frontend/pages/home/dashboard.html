<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
    <title>Meu perfil - GUP</title>
    <script src="../../js/api.js"></script>
    <script type="module" src="./dashboard.js"></script>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="../../components/sidebar/sidebar.css">
    <link rel="stylesheet" href="../../components/giraffe-view/giraffe-view.css">
    <link rel="stylesheet" href="../../components/goal-card/goal-card.css">
    <link rel="stylesheet" href="../../components/level-up-modal/level-up-modal.css">
    <link rel="stylesheet" href="./css-home.css">
    <link rel="stylesheet" href="./css-task.css">
</head>
<body>
    <div class="app-layout">
        <main class="page profile-page">
            <!-- capa, avatar/girafa, nome e números: montado em js-profile/profile-hero.js -->
            <header id="profile-hero" class="profile-hero is-loading" aria-busy="true">
                <div class="hero-cover"></div>
            </header>

            <p id="mensagem" class="mensagem"></p>

            <!-- só responsável: cartões das crianças (também filtram as tarefas) -->
            <section id="family-section" class="family-section" hidden>
                <h2 class="section-title">Família</h2>
                <div class="family-container"></div>
            </section>

            <div class="profile-grid">
                <section id="tasks-section" class="profile-main">
                    <div class="section-head">
                        <h2 class="section-title">Tarefas de hoje</h2>
                        <div class="div-create-task"></div>
                    </div>
                    <section class="task-container">
                        <div class="task-filters"></div>
                        <section class="task-list"></section>
                    </section>
                </section>

                <aside class="profile-side">
                    <!-- só criança -->
                    <article id="child-goal" hidden></article>

                    <article id="section-events" class="side-card">
                        <div class="section-head">
                            <h2 class="section-title">Próximos eventos</h2>
                            <div class="div-create-event"></div>
                        </div>
                        <div class="events-list"></div>
                    </article>
                </aside>
            </div>
        </main>
    </div>
</body>
</html>
