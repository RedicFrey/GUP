<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
    <title>Quem está usando? - GUP</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="./profiles.css">
    <script type="module" src="./profiles.js"></script>
</head>
<body class="profiles-body">
    <main class="profiles-main">
        <p class="profiles-brand">GUP</p>
        <h1 class="profiles-title">Quem está usando?</h1>
        <p class="profiles-lead">Cada pessoa da família tem o seu perfil, com as próprias tarefas e moedas.</p>

        <!-- os perfis entram aqui pelo profiles.js -->
        <ul id="profiles-options"></ul>

        <p id="mensagem" class="mensagem"></p>

        <button type="button" class="btn btn-ghost profiles-logout" id="sair">Sair da conta da família</button>
    </main>

    <!-- janelinha do PIN (só abre se o perfil tiver PIN) -->
    <dialog id="dialogo-pin">
        <div class="dialog-head">
            <h2 class="dialog-title" id="pin-titulo"></h2>
            <form method="dialog"><button class="btn btn-ghost btn-icon" aria-label="Fechar"><i class="icone i-close"></i></button></form>
        </div>
        <form class="form-stack" id="form-pin">
            <div class="field">
                <label for="pin">Digite seu PIN</label>
                <input type="password" id="pin" inputmode="numeric" autocomplete="off" required>
            </div>
            <p class="mensagem" id="pin-mensagem"></p>
            <div class="dialog-actions"><button type="submit" class="btn-primary">Entrar</button></div>
        </form>
    </dialog>

    <div id="aviso-offline" hidden>Não foi possível falar com o servidor. Confira se o backend está rodando.</div>
</body>
</html>
