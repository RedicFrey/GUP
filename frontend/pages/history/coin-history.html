<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
    <title>Moedas - GUP</title>
    <script src="../../js/api.js"></script>
    <script type="module" src="./coin-history-js/coin-history.js"></script>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="../../components/sidebar/sidebar.css">
    <link rel="stylesheet" href="./coin-history.css">
</head>
<body>
    <div class="app-layout">
        <main class="page coin-page" id="main-coin-history">
            <header class="page-head">
                <div>
                    <h1 class="page-title">Moedas</h1>
                    <p class="page-sub">Tudo o que entrou e saiu da carteira.</p>
                </div>
            </header>

            <section class="coin-history-filters">
                <div class="filter-children"></div>
            </section>

            <section class="coin-balance-card" aria-live="polite"></section>

            <section class="coin-statement">
                <div class="section-head">
                    <h2 class="section-title">Extrato</h2>
                    <div class="filter-type"></div>
                </div>
                <section class="transaction-group"></section>
            </section>

            <p class="mensagem" id="mensagem"></p>
        </main>
    </div>
</body>
</html>
